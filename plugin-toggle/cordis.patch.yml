# dsh-plugin-toggle — bundle 层挂载补丁（官方安装机制）
#
# 本包 package.json 声明 `dsh.bundle.patch: ./cordis.patch.yml`，此文件作为
# profile 的 bundle 层 patch 应用（`- insert:` 语义，新增 `plugin-toggle` 条目）。
# 由以下任一方式触发：
#   - `dsh plugin --profile web add <本目录>`（pnpm 安装 + 自动登记 bundles），或
#   - 手动：把 `dsh-plugin-toggle` 加进 profiles/web/package.json 的
#     dsh.profile.bundles（配合 profile node_modules 的 junction 让包可解析）。
# 两者都必须用 `- insert:`：profile patch 是「针对性补丁」语义，裸 `- id: ...`
# 会被当作对不存在条目的补丁而告警跳过（patch: entry "plugin-toggle" not found）。
#
# 本插件只做插件条目管理（设置 → 插件 → 插件列表 的停用/启用）；模型提供商的
# 停用/启用由独立插件 dsh-provider-manager（条目 provider-manager）提供；Web 搜索
# （图灵 Baidu/Tavily）是独立插件 dsh-turing-web-search（条目 turing-web-search）。
- insert:
    - id: plugin-toggle
      name: dsh-plugin-toggle
