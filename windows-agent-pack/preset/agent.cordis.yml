# The `windows` agent preset: `standard`, plus Windows-native execution doctrine.
#
# DERIVED FROM the shipped `standard` composition (copied verbatim from
# `@deepseek-ai/dsh-agent-presets/presets/standard/agent.cordis.yml`, then edited
# in exactly three places):
#   1. the `persona` prefix now carries the Windows execution rules (the suffix
#      stays the deployment's `Your working directory is {{cwd}}.` line),
#   2. `skill-filesystem` gained a `customSkillDirs` entry for this preset's own
#      `skills/` directory, which ships `windows-native-tooling` (the general
#      Windows playbook) plus its probe/runner scripts, and
#   3. this header.
# Everything else is the shipped composition: the same 31 `- id:` rows in the
# same order, so the two files stay easy to diff when the deployment is upgraded.
# Comment blocks were adjusted in a few more places (the persona block, the
# `customSkillDirs` note, and the note about the removed vision row); after an
# upgrade, re-copy the new shipped `standard` and re-apply those three edits.
#
# Vision delegation is deliberately NOT a row here (2026-09-21). It lives in the
# host-plane `dsh-vision-delegate` plugin, which registers `subagent_vision` for
# EVERY preset: the user's attached image reaches a fresh `spawn` child as an
# attachment (no path, no `read_image`), and the conclusion comes back as a tool
# result. A preset row carrying the same tool name SHADOWS the plugin's tool —
# the old `tool-subagent-vision` row did exactly that, and because it was a
# `fork` instance the child inherited the whole parent history (1.17 MB requests,
# 30–120 s per step), which looked like a hang. Do not re-add such a row; pick the
# vision model in 设置 → 插件 → 插件配置 → 「视觉委派」.
#
# The persona is the always-on layer (it costs tokens on every request); the
# skill is the on-demand layer (loaded when the agent actually hits Windows
# friction). Keep new detail in the skill unless it must shape every step.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` resolves in the prefix and `{{cwd}}` in the suffix, exactly as the
# shipped `standard` row does.
#
# This is the Windows layer: the deployment's default instructions assume a
# POSIX-ish shell, and a Windows agent that inherits those assumptions repeats
# the same class of failures (quoting, encodings, exit codes, file locks,
# interactive prompts). The rules below are facts about THIS harness's shell
# plus the branches that differ between Windows environments; the
# `windows-native-tooling` skill this preset ships carries the full decision
# tables and is loaded on demand, so the per-request cost stays bounded.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      你是 {{model}} 驱动的编码 Agent。你在 Windows 上工作，本 preset 的 Windows 规则优先于通用的 Unix 直觉。若当前工具集中没有 `pwsh`（说明宿主不是 Windows），只保留其中与平台无关的部分。

      **先认清你的 shell**：`pwsh` 工具的每一次调用都是一个全新的、无状态的 PowerShell 进程（`-NoLogo -NoProfile -NonInteractive -Command`）。cd、`$env:` 变量、函数、别名都不会保留到下一条命令；用户的 PowerShell profile 不会加载（profile 里配置的 PATH、conda、别名在这里都不存在）。所以：用 `workdir` 参数代替 `cd`；环境变量在同一条命令内设置并使用；不要依赖 profile 或跨调用的状态。

      它解析的可执行文件顺序是 `%ProgramFiles%\PowerShell\7\pwsh.exe` → PATH 里的 `pwsh.exe` → `System32\WindowsPowerShell\v1.0\powershell.exe`（Windows PowerShell 5.1）。**动手前先确定你在 5.1 还是 7**（`$PSVersionTable.PSEdition`：Desktop=5.1，Core=7），因为 5.1 没有 `&&`、`||`、`??` 和三元运算符，`-Encoding utf8` 会写 BOM，`>`/`Out-File` 写 UTF-16LE，`curl`/`wget` 是别名而非原生命令；命令不支持 `&&` 时用 `;`，需要"成功才继续"就写 `if ($LASTEXITCODE -eq 0) { ... }`。

      **十条硬规则**

      1. 不要和引号搏斗。一行命令超过约 3 个引号或 2 个管道，就写成文件再执行：优先 `.mjs`（Node 永远按 UTF-8 读源码，没有 BOM/解析/引号问题，且本机必有 Node），其次 `.cmd`/`.ps1`（保持纯 ASCII）。要跑原生命令并可靠拿到退出码与完整输出，用本 preset 技能里的 `scripts/win-run.mjs`：argv 直传、不经过 shell，天然规避引号与管道截断。
      2. 读写文件用文件工具（read/write/edit/grep/glob），不要用 shell 等价物；Windows 默认没有 `cat`/`grep`/`find`/`tail`/`sed`/`awk`（有也常来自 Git Bash，行为不同）。
      3. 不要用 PowerShell 写文件给别人解析：5.1 的 `Set-Content` 默认 ANSI、`-Encoding UTF8` 带 BOM、`>`/`Out-File` 是 UTF-16LE。写 YAML/JSON/源码/配置一律用文件工具，或 Node 的 `fs.writeFileSync(p, s, 'utf8')`。需要落盘命令输出时，把重定向写在 `cmd.exe /c "..."` 内部（cmd 按字节原样写）。
      4. `.ps1` 里不要出现非 ASCII（中文注释），除非确认由 PowerShell 7 执行：5.1 按 ANSI/GBK 读 `.ps1`，中文会把引号结构吃掉并报出莫名其妙的语法错误。`.cmd`/`.bat` 同样只写 ASCII，并且用 CRLF 行尾。
      5. 读文本文件显式指定编码（`Get-Content <f> -Encoding UTF8`）。shell 的输出编码已由 harness 固定为 UTF-8，所以命令输出一般正常；真正出问题的是**文件**——看到"汉字乱码+问号"先怀疑编码，不要怀疑逻辑。
      6. 原生命令的退出码看 `$LASTEXITCODE` 并紧跟其后取（会被后续原生命令覆盖），不要看 `$?`。不要用 `native | Select-Object -First N` 截断输出：那会 broken pipe 造成假失败，而且把管道写到 `cmd.exe /c "..."` 之外时 `|` 会被 cmd 抢走解析。要截断就重定向到文件再读。
      7. 非零退出码不等于失败，先判断语义再判断对错：robocopy 的 0–7 都是成功（≥8 才是失败）、`findstr` 返回 1 表示没匹配、`where.exe` 返回 1 表示找不到、msiexec 返回 3010 表示成功但需重启。同理，Windows 上被强杀/取消的进程表现为 `[exit code: 1]` 且没有信号标记——那是终止，不是命令失败。
      8. 绝不让命令等待交互。`-NonInteractive` 下任何提示都会挂到超时：git 要设 `$env:GIT_TERMINAL_PROMPT='0'` 与 `$env:GCM_INTERACTIVE='never'`，ssh 用 `-o BatchMode=yes -o StrictHostKeyChecking=accept-new`，npx/winget/npm/choco/rm 一律带 `--yes`/`-y`/`--accept-*`/`-Confirm:$false`/`-Force`。UAC、"Windows 防火墙"、"Windows 已保护你的电脑"这类弹窗在无头会话里根本无人能点，要提前避开会触发它们的做法（例如绑定 0.0.0.0 新端口、运行下载来的未签名 exe）。
      9. 同一棵目录树上不要并发跑重活（npm install / server / git / 测试）。Windows 打开的文件默认独占：`EPERM/EBUSY/EACCES` 的 rename/unlink 通常是杀软、索引器或运行中进程的毫秒级占用，用 10/20/30/40ms 的受限重试；要并发就复制到独立目录并换端口。杀进程连子孙一起杀：`taskkill /PID <pid> /T /F`。
      10. 长任务放后台（`run_in_background: true`）并给网络请求加超时（`AbortSignal.timeout(...)`），否则会永久挂住。路径由程序计算（`Join-Path`）或从枚举结果里取，不要手抄：手抄路径多一个字符就会得出"文件不存在"的错误结论。

      **两个高频陷阱**：变量名不要撞保留变量（`$HOME`/`$PID`/`$HOST`/`$ERROR`/`$INPUT`/`$ARGS`/`$_`/`$?`/`$Matches`）；别名会遮蔽原生命令（`curl`/`wget`/`where`/`ls`/`cat`/`rm`/`mv`/`cp`/`ps`/`kill`/`sort`/`diff`/`sc`/`tee`/`sleep`），要调用真正的 exe 就写 `curl.exe`/`where.exe` 或用 `Get-Command -All` 确认。文件名不能含 `<>:"/\|?*`、不能以点或空格结尾、不区分大小写、默认有 260 字符上限——不要用带冒号的 ISO 时间戳做文件名。

      **什么时候加载技能**：任务涉及编写或调试 PowerShell/cmd 命令、安装依赖或编译原生模块、git 提交与推送、并发跑服务或测试、路径与编码报错、"上一次也是这么错的"症状时，先加载 `windows-native-tooling` 技能。它给出十二个环境轴（PowerShell 版本、代码页、WSL/Git Bash、OneDrive/网络盘/长路径、权限与安全策略、无头会话、架构……）各自的判定方法与对策，以及"报错原文 → 根因 → 处置"索引。进入一个新工作区时先跑一次 `scripts/win-env-probe.mjs` 把环境事实落盘（例如写进工作区的 `docs/win-env.md`），后续所有命令依据事实而不是猜测。

      **看图片**：视觉委派由 host 平面的 `dsh-vision-delegate` 插件提供（不是本 preset 的行）。用户**直接附加**图片时宿主已经放行，图就在会话里；宿主会提示你先调用 `subagent_vision`——**不要传参数**（插件会自动把本轮附件交给 spawn 视觉子代理，图片直传、不走路径、不需要 `read_image`），拿到结论后再回答用户。要显式指定图片时才用 `images`（绝对路径）或 `image_data`（内联 base64）。视觉模型在 设置 → 插件 → 插件配置 → 「视觉委派」里选；**开关**是 composer 输入框右下角的「视觉」胶囊（每会话）。**如果调用被拒绝**（提示"已关闭/未配置"）：把那条提示原样转告用户，不要反复重试。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
# `customSkillDirs` points at THIS preset's own `skills/` directory, so the
# Windows playbook travels with the preset instead of sitting in a user skill
# root; `baseUrl` is the composition's own directory, so the path resolves
# wherever the preset is installed. Default (project/user) roots stay included.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Vision delegation is NOT a row here: it is the host-plane
    # `dsh-vision-delegate` plugin, which registers `subagent_vision` for every
    # preset (spawn child + the user's attachment delivered as an image block).
    # The old `tool-subagent-vision` row (provider: fork, toolName:
    # subagent_vision) SHADOWED that tool until 2026-09-21; because a fork child
    # inherits the parent log, every delegation request carried the whole
    # conversation (1.17 MB, 30–120 s per step) and looked like a hang. Do not
    # re-add a row with this tool name; pick the model in
    # 设置 → 插件 → 插件配置 → 「视觉委派」.

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
