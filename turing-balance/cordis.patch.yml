# dsh-turing-balance — bundle 层挂载补丁（官方安装机制）
#
# 本包 package.json 声明 `dsh.bundle.patch: ./cordis.patch.yml`，此文件作为
# profile 的 bundle 层 patch 应用（`- insert:` 语义，新增 `turing-balance` 条目）。
# 必须用 `- insert:`：profile patch 是「针对性补丁」语义，裸 `- id: ...` 会被
# 当作对不存在条目的补丁而告警跳过。
- insert:
    - id: turing-balance
      name: dsh-turing-balance
